<!-- Contact Section Content -->
<section id="contact" class="section">
    <div class="container">
        <div class="section-header">
            <p class="section-title">Get In Touch</p>
            <h2>Contact Me</h2>
        </div>

        <div class="grid grid-2">
            <div class="contact-form">
                <h3>Send Me a Message</h3>
                <form id="contact-form" action="https://formsubmit.co/kangwen.jia@outlook.com" method="POST">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <!-- FormSubmit hidden fields -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="http://localhost:5051/#contact?success=true">

                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>

            <div class="contact-info">
                <h3>Ways to Connect</h3>
                
                <div class="contact-item">
                    <h4>📧 Email</h4>
                    <p><a href="mailto:kangwen.jia@outlook.com">kangwen.jia@outlook.com</a></p>
                </div>

                    </div>

                        <a href="https://github.com/JiaKaren" target="_blank">

                        </a>

                    <div class="social-icon-item">
